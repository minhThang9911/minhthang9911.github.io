# Gói dữ liệu offline cho app Tra Cứu Thuốc (home.free.tracuuthuoc).
#
# Mỗi thứ Hai 02:00 giờ Việt Nam: cào lịch sự hai cổng công khai của Bộ Y tế
# (Cục Quản lý Dược, Cục Quản lý Y, Dược cổ truyền), dựng SQLite + FTS5, nén,
# rồi đăng vào Release cố định "tracuuthuoc-data". App đọc:
#   https://github.com/minhThang9911/minhthang9911.github.io/releases/download/tracuuthuoc-data/manifest.json
#
# Bản gốc của script: repo flutter15, tools/tracuuthuoc_data/snapshot.py
# (sửa ở đó rồi chép sang .github/tracuuthuoc/snapshot.py).
name: tracuuthuoc-data

on:
  schedule:
    - cron: "0 19 * * 0" # Chủ nhật 19:00 UTC = thứ Hai 02:00 ICT
  workflow_dispatch:
    inputs:
      publish:
        description: "Đăng lên Release (bỏ chọn để chạy thử)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tracuuthuoc-data
  cancel-in-progress: false

env:
  TAG: tracuuthuoc-data
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/tracuuthuoc
          sparse-checkout-cone-mode: false

      - name: Manifest bản trước
        run: |
          gh release download "$TAG" -p manifest.json -O previous.json \
            -R "$GITHUB_REPOSITORY" || echo "chưa có bản trước"

      - name: Cào và dựng gói
        run: |
          python3 --version
          python3 -c "import sqlite3; print('sqlite', sqlite3.sqlite_version)"
          args=(--out out)
          [ -f previous.json ] && args+=(--previous previous.json)
          python3 .github/tracuuthuoc/snapshot.py "${args[@]}"
          ls -l out

      - name: Đăng Release
        if: github.event_name == 'schedule' || inputs.publish
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              --title "Tra Cứu Thuốc — dữ liệu offline" \
              --notes "Gói dữ liệu offline cho app Tra Cứu Thuốc, cập nhật mỗi thứ Hai. Nguồn: cổng dịch vụ công Cục Quản lý Dược (dichvucong.dav.gov.vn) và Cục Quản lý Y, Dược cổ truyền (ydct-dichvucong.moh.gov.vn) – Bộ Y tế. Không phải dữ liệu chính thức; chỉ để tham khảo." \
              --latest=false
          fi
          # Gói trước, manifest sau: manifest không bao giờ trỏ tới tệp chưa có.
          gh release upload "$TAG" out/*.db.gz --clobber -R "$GITHUB_REPOSITORY"
          gh release upload "$TAG" out/manifest.json --clobber -R "$GITHUB_REPOSITORY"
          # Giữ 2 gói mới nhất (máy đang tải dở bản cũ không hỏng).
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets \
            -q '.assets[].name' | grep -E '^tracuuthuoc-[0-9]{8}\.db\.gz$' \
            | sort -r | tail -n +3 | while read -r old; do
              echo "xoá $old"
              gh release delete-asset "$TAG" "$old" -y -R "$GITHUB_REPOSITORY"
            done
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets \
            -q '.assets[] | "\(.name)\t\(.size)"'
